# Publica o site no cPanel a cada push na main: envia por FTPS só o que mudou desde o último envio.
# Configuração (uma vez só), no GitHub: Settings > Secrets and variables > Actions
#   Variables: FTP_SERVIDOR (ex.: ftp.seudominio.com.br), FTP_USUARIO (a conta FTP criada para o site)
#              FTP_PASTA (opcional; "./" quando a conta FTP já abre na pasta do site)
#              SITE_URL (opcional; ex.: https://seudominio.com.br/ — liga a conferência depois do envio)
#   Secrets:   FTP_SENHA
# Passo a passo e solução de problemas: docs/DEPLOY_CPANEL.md, seção "Atualização automática".
name: Publicar no cPanel

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'database/**'
      - 'firmware/**'
      - 'deploy/**'
      - '.impeccable/**'
      - '**.md'
  workflow_dispatch: # botão "Run workflow" na aba Actions, para publicar de novo na mão

concurrency:
  group: publicar-cpanel
  cancel-in-progress: false

jobs:
  publicar:
    # sem o servidor configurado, o push não falha: só não publica
    if: ${{ vars.FTP_SERVIDOR != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Baixar o código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Enviar para o cPanel
        uses: SamKirkland/FTP-Deploy-Action@110f9186c050f71550953127052e77650219c287 # v4.4.0
        with:
          server: ${{ vars.FTP_SERVIDOR }}
          username: ${{ vars.FTP_USUARIO }}
          password: ${{ secrets.FTP_SENHA }}
          protocol: ${{ vars.FTP_PROTOCOLO || 'ftps' }}
          server-dir: ${{ vars.FTP_PASTA || './' }}
          # O que fica só no repositório (e o que o servidor cria sozinho) nunca é enviado nem apagado lá.
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            docs/**
            database/**
            firmware/**
            deploy/**
            video/**
            .impeccable/**
            .claude/**
            *.md
            api/config.local.php
            api/storage/sessoes/**
            api/storage/limites/**
            downloads/*.apk

      # Com a variável SITE_URL (ex.: https://seudominio.com.br/), confere o site logo depois do envio:
      # páginas no ar, arquivos internos bloqueados, cabeçalhos de segurança e a resposta da API.
      # O resultado aparece no resumo da execução (aba Actions); falha se uma página sumir ou algo interno vazar.
      - name: Conferir o site no ar
        if: ${{ vars.SITE_URL != '' }}
        env:
          SITE: ${{ vars.SITE_URL }}
        run: |
          SITE="${SITE%/}"
          OUT="$GITHUB_STEP_SUMMARY"
          falhou=0
          codigo() { curl -s -o /dev/null -w '%{http_code}' --max-time 25 "$SITE/$1" || true; }
          {
            echo "### Site depois do envio: $SITE"
            echo ""
            echo "| Endereço | Esperado | Resposta |"
            echo "|---|---|---|"
          } >> "$OUT"
          for p in "" lockmachine.html privacidade.html termos.html app/ assets/img/env-room.png; do
            c=$(codigo "$p")
            [ "$c" = 200 ] && r="✅ $c" || { r="❌ $c"; falhou=1; }
            echo "| /$p | 200 | $r |" >> "$OUT"
          done
          for p in api/config.local.php api/lib/bootstrap.php api/storage/ .ftp-deploy-sync-state.json database/schema.sql CLAUDE.md; do
            c=$(codigo "$p")
            [ "$c" != 200 ] && r="✅ $c" || { r="❌ $c (aberto!)"; falhou=1; }
            echo "| /$p | bloqueado | $r |" >> "$OUT"
          done
          cab=$(curl -sI --max-time 25 "$SITE/" | tr -d '\r')
          for h in Content-Security-Policy X-Content-Type-Options Strict-Transport-Security; do
            echo "$cab" | grep -qi "^$h:" && r="✅ presente" || r="⚠️ ausente"
            echo "| cabeçalho $h | presente | $r |" >> "$OUT"
          done
          api=$(curl -s --max-time 25 "$SITE/api/health.php" | head -c 400)
          { echo ""; echo "API (\`/api/health.php\`): \`${api:-sem resposta}\`"; } >> "$OUT"
          cat "$OUT"
          exit $falhou
